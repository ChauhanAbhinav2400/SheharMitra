name: sheharmitra-local

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # Development only: bind to this computer, never a public interface.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - sheharmitra-mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { if (!rs.status().ok) quit(1); }
          catch (e) {
            if (e.code === 94) {
              rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
            }
            quit(1);
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30

volumes:
  sheharmitra-mongo:
